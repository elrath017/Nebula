<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Glass Border Gradient (Electric Cyan to Hot Crimson) -->
    <linearGradient id="glassBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#A855F7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FF1744" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Cyan Swirl Gradient -->
    <linearGradient id="cyanSwirl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <!-- Red Swirl Gradient -->
    <linearGradient id="redSwirl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1744"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>

    <!-- Central Play Triangle Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Space Background -->
  <rect width="512" height="512" fill="#090A16"/>

  <!-- Squircle Glass Container -->
  <rect x="56" y="56" width="400" height="400" rx="96" ry="96" fill="#10132B" fill-opacity="0.85" stroke="url(#glassBorder)" stroke-width="4" />

  <!-- Swirling Nebula Spiral Paths -->
  <g filter="url(#glow)">
    <!-- Blue/Cyan Swirl -->
    <path d="M 256 120 C 170 140, 130 210, 160 300 C 190 380, 260 400, 320 370 C 230 380, 180 320, 200 250 C 210 200, 260 160, 320 170 Z" fill="url(#cyanSwirl)" opacity="0.85" />
    
    <!-- Red/Crimson Swirl -->
    <path d="M 256 392 C 342 372, 382 302, 352 212 C 322 132, 252 112, 192 142 C 282 132, 332 192, 312 262 C 302 312, 252 352, 192 342 Z" fill="url(#redSwirl)" opacity="0.85" />
  </g>

  <!-- Glowing Play Triangle -->
  <g filter="url(#glow)" transform="translate(16, 0)">
    <path d="M 215 165 C 225 155, 245 155, 255 165 L 345 235 C 360 245, 360 265, 345 275 L 255 345 C 245 355, 225 355, 215 345 L 215 165 Z" 
          fill="none" stroke="url(#glassBorder)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Starburst Core -->
  <circle cx="272" cy="256" r="16" fill="#FFFFFF" filter="url(#glow)"/>
  <path d="M 272 220 L 272 292 M 236 256 L 308 256" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.9" />
</svg>
